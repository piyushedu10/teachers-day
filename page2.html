<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="color-scheme" content="only light">
<meta name="description" content="Enter your teacher name - INKPUNK Teacher's Day Card">
<title>INKPUNK x Teacher's Name Entry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;700;800&family=Caveat+Brush&family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

:root{
  color-scheme: only light;
  --ink:#0A0A0A;
  --paper:#F5F5F0;
  --pink:#FF2A54;
  --acid:#CCFF00;
  --cyan:#00F0FF;
  --charcoal:#1A1A1A;
  --font-display:'Bricolage Grotesque',sans-serif;
  --font-hand:'Caveat Brush',cursive;
  --font-mono:'IBM Plex Mono',monospace;
  --shadow-brutal:8px 8px 0px var(--ink);
  --shadow-brutal-sm:4px 4px 0px var(--ink);
}

html{scroll-behavior:smooth}
body{
  background:var(--ink) !important;
  color:var(--paper) !important;
  font-family:var(--font-mono);
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  min-height:100svh;
  display:flex;
  flex-direction:column;
}

/* Ambient glow — no blur filter */
.aurora-glow{position:fixed;border-radius:50%;pointer-events:none;z-index:0}
.aurora-1{width:240px;height:240px;background:radial-gradient(circle,rgba(255,42,84,.14),transparent 70%);top:-40px;left:-40px;animation:auroraDrift 10s ease-in-out infinite alternate}
.aurora-2{width:220px;height:220px;background:radial-gradient(circle,rgba(204,255,0,.1),transparent 70%);bottom:-30px;right:-30px;animation:auroraDrift 13s ease-in-out infinite alternate-reverse}
@keyframes auroraDrift{0%{transform:translate(0,0)}100%{transform:translate(20px,-15px)}}

/* Border animation */
.border-anim{position:fixed;z-index:3;pointer-events:none}
.border-top,.border-bottom{left:0;right:0;height:2px;background:repeating-linear-gradient(90deg,var(--acid) 0,var(--acid) 10px,transparent 10px,transparent 20px);background-size:200% 2px;animation:dashMove 6s linear infinite;opacity:.2}
.border-left,.border-right{top:0;bottom:0;width:2px;background:repeating-linear-gradient(0deg,var(--acid) 0,var(--acid) 10px,transparent 10px,transparent 20px);background-size:2px 200%;animation:dashMoveV 6s linear infinite;opacity:.2}
.border-top{top:8px}.border-bottom{bottom:8px}.border-left{left:8px}.border-right{right:8px}
@keyframes dashMove{to{background-position:200% 0}}
@keyframes dashMoveV{to{background-position:0 200%}}

/* Top Nav */
.top-bar{
  padding:20px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:relative;
  z-index:20;
  flex-wrap:wrap;
  gap:10px;
  border-bottom:1px solid rgba(204,255,0,.12);
}
.btn-back{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:none;
  border:2.5px solid var(--acid);
  color:var(--acid);
  padding:10px 20px;
  font-family:var(--font-mono);
  font-size:clamp(11px, 2.5vw, 14px);
  font-weight:700;
  letter-spacing:.15em;
  text-transform:uppercase;
  cursor:pointer;
  text-decoration:none;
  transition:background .2s,color .2s;
  -webkit-user-select:none;
  user-select:none;
}
.btn-back:active{background:var(--acid);color:var(--ink)}
.page-tag{font-family:var(--font-mono);font-size:11px;letter-spacing:.2em;color:var(--pink);text-transform:uppercase}

/* Main container */
.page-container{
  max-width:560px;
  width:100%;
  margin:0 auto;
  padding:48px 24px 80px;
  position:relative;
  z-index:10;
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

/* Header */
.entry-header{text-align:center;margin-bottom:44px}
.entry-title{
  font-family:var(--font-display);
  font-size:clamp(36px, 9.5vw, 76px);
  font-weight:800;
  line-height:.95;
  text-transform:uppercase;
  letter-spacing:-.03em;
  color:var(--paper) !important;
  animation:fadeUp .5s ease .1s both;
}
.entry-title em{font-style:normal;color:var(--acid) !important}
.entry-subtitle{
  margin-top:16px;
  font-size:clamp(11px, 2.8vw, 15px);
  color:#909090 !important;
  letter-spacing:.12em;
  text-transform:uppercase;
  animation:fadeUp .5s ease .2s both;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* Form Card */
.form-card{
  background:var(--paper) !important;
  color:var(--ink) !important;
  border:4px solid var(--ink) !important;
  padding:44px 28px;
  box-shadow:var(--shadow-brutal);
  position:relative;
  animation:fadeUp .5s ease .3s both;
}
.form-card::before{
  content:'TEACHER IDENTIFICATION #059';
  position:absolute;
  top:-13px;left:20px;
  background:var(--acid) !important;
  border:2.5px solid var(--ink) !important;
  padding:3px 12px;
  font-size:9px;
  font-weight:700;
  letter-spacing:.18em;
  color:var(--ink) !important;
  white-space:nowrap;
}

.form-group{margin-bottom:32px}
.form-label{
  display:block;
  font-family:var(--font-mono);
  font-size:clamp(11px, 2.5vw, 14px);
  font-weight:700;
  letter-spacing:.15em;
  text-transform:uppercase;
  margin-bottom:12px;
  color:var(--ink) !important;
}
.form-input{
  width:100%;
  background:var(--paper) !important;
  border:3px solid var(--ink) !important;
  padding:16px 18px;
  font-family:var(--font-mono);
  font-size:16px;
  font-weight:600;
  color:var(--ink) !important;
  outline:none;
  transition:border-color .2s,box-shadow .2s;
  border-radius:0;
  -webkit-appearance:none;
  appearance:none;
}
.form-input:focus{border-color:var(--pink) !important;box-shadow:4px 4px 0px var(--ink)}

.btn-unlock{
  width:100%;
  margin-top:10px;
  background:var(--acid) !important;
  color:var(--ink) !important;
  border:3.5px solid var(--ink) !important;
  padding:18px;
  font-family:var(--font-mono);
  font-size:14px;
  font-weight:700;
  letter-spacing:.22em;
  text-transform:uppercase;
  cursor:pointer;
  box-shadow:var(--shadow-brutal);
  transition:transform .15s,box-shadow .15s;
  -webkit-user-select:none;
  user-select:none;
  border-radius:0;
  -webkit-appearance:none;
  appearance:none;
}
.btn-unlock:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}

/* Footer */
.site-footer{
  padding:36px 20px;
  text-align:center;
  background:var(--ink) !important;
  color:var(--paper) !important;
  border-top:3px solid var(--acid);
  position:relative;
  z-index:10;
}
.footer-text{font-family:var(--font-mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#888 !important}
.footer-heart{color:var(--pink) !important;display:inline-block;animation:heartBeat 1.5s ease-in-out infinite}
@keyframes heartBeat{0%,100%{transform:scale(1)}15%{transform:scale(1.3)}30%{transform:scale(1)}}

.by-piyush-watermark{position:fixed;bottom:16px;left:16px;font-family:var(--font-hand);font-size:16px;color:var(--acid) !important;opacity:.65;z-index:9998;pointer-events:none;user-select:none;text-shadow:0 0 10px rgba(204,255,0,.4)}

@media(hover:hover){
  .btn-back:hover{background:var(--acid) !important;color:var(--ink) !important}
  .btn-unlock:hover{transform:translate(-3px,-3px);box-shadow:8px 8px 0 var(--pink);background:var(--cyan) !important;color:var(--ink) !important}
}
</style>
</head>
<body>

<div class="by-piyush-watermark">✦ By Piyush Mundhra</div>

<div class="aurora-glow aurora-1"></div>
<div class="aurora-glow aurora-2"></div>
<div class="border-anim border-top"></div>
<div class="border-anim border-bottom"></div>
<div class="border-anim border-left"></div>
<div class="border-anim border-right"></div>

<div class="top-bar">
  <a href="index.html" class="btn-back">← HOME</a>
  <span class="page-tag">CHAPTER 02 — NAME ENTRY</span>
</div>

<main class="page-container">
  <div class="entry-header">
    <h1 class="entry-title">ENTER YOUR NAME, <em>TEACHER!</em></h1>
    <p class="entry-subtitle">Uncovers your personalized inkpunk card</p>
  </div>

  <div class="form-card">
    <form id="teacherForm" onsubmit="handleTeacherSubmit(event)">
      <div class="form-group">
        <label class="form-label" for="teacherNameInput">Your Name</label>
        <input
          type="text"
          id="teacherNameInput"
          class="form-input"
          placeholder="e.g. Mrs. Sharma"
          required
          autocomplete="name"
          enterkeyhint="go"
        >
      </div>
      <button type="submit" class="btn-unlock" id="btnUnlock">
        ⚡ VIEW MY CARD
      </button>
    </form>
  </div>
</main>

<footer class="site-footer">
  <p class="footer-text">MAHESHWARI PUBLIC SCHOOL — TEACHER'S DAY SPECIAL <span class="footer-heart">♥</span></p>
</footer>

<script>
function handleTeacherSubmit(e) {
  e.preventDefault();
  const inputName = document.getElementById('teacherNameInput').value.trim();
  if (!inputName) return;
  sessionStorage.setItem('searchTeacherName', inputName);
  window.location.href = 'card.html?name=' + encodeURIComponent(inputName);
}
</script>
</body>
</html>
